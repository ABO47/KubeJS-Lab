pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        gradlePluginPortal()
    }
}

rootProject.name = 'KubeJS Lab'

include 'kubejslab-common'
include 'kubejslab-forge'
include 'kubejslab-fabric'

project(':kubejslab-common').projectDir = file('common')
project(':kubejslab-forge').projectDir = file('forge')
project(':kubejslab-fabric').projectDir = file('fabric')
