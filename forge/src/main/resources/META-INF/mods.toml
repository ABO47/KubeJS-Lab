modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="kubejslab.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ldlib"
mandatory=true
versionRange="[${ldlib_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
mandatory=true
versionRange="[${kubejs_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
mandatory=true
versionRange="[${architectury_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rhino"
mandatory=true
versionRange="[${rhino_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=true
versionRange="${jei_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
mandatory=false
versionRange="[6.0.8,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="kubejslab.forge.mixins.json"
